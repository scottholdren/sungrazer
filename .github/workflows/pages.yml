# Publishes results/ to GitHub Pages through Actions instead of the legacy branch build.
# The legacy build has no status to watch and sat in "building" for minutes on
# 2026-11-07 while a hunter's package waited; this deploys in about a minute and
# shows up in the Actions tab. Only results/ is served: the site is the packages.
name: pages

on:
  push:
    branches: [main]
    paths: ["results/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer export supersedes an older deploy: the site should carry the latest package, and a deploy
# that GitHub's Pages backend has sat on for minutes (2026-11-07: 21 s normally, then one hung for
# 10 min while the next waited behind it) is worth less than the one queued behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: results
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r results site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000  # ms; give up on a hung deploy after 5 min instead of 10 so the next push gets its turn
