[project]
name = "kreutz"
version = "0.1.0"
description = "Detect Kreutz sungrazing comets in NOAA CCOR coronagraph frames"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "astropy", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kreutz = "kreutz.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kreutz = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
